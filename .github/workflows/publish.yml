name: Maven Package

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: | 
          shopt -s extglob
          gh release upload ${{ github.event.release.tag_name }} target/!(original-*).jar
      - name: Upload to Modrinth
        env:
          MODRINTH_PAT: ${{ secrets.MODRINTH_PAT }}
        run: python3 .github/workflows/publish_to_modrinth.py
